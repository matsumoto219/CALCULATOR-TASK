<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script src="https://code.jquery.com/jquery-3.2.1.js" integrity="sha256-DZAnKJ/6XZ9si04Hgrsxu/8s717jcIzLy3oi35EouyE=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="main.css">
    <title>電卓</title>
  </head>

  <body>
    <div class="app">
      <main class="calculator" aria-label="電卓">
        <div class="calculator__inner">
          <!-- 表示ディスプレイ -->
          <div class="calculator__display" aria-live="polite" aria-label="表示ディスプレイ">
            <div class="calculator__display-text" id="display">0</div>
          </div>

          <!-- ボタン -->
          <div class="calculator__keys" aria-label="入力キー">
            <!-- 1行目 -->
            <button class="key" type="button" data-value="7">7</button>
            <button class="key" type="button" data-value="8">8</button>
            <button class="key" type="button" data-value="9">9</button>
            <button class="key key--operator" type="button" data-value="+">+</button>

            <!-- 2行目 -->
            <button class="key" type="button" data-value="4">4</button>
            <button class="key" type="button" data-value="5">5</button>
            <button class="key" type="button" data-value="6">6</button>
            <button class="key key--operator" type="button" data-value="-">-</button>

            <!-- 3行目 -->
            <button class="key" type="button" data-value="1">1</button>
            <button class="key" type="button" data-value="2">2</button>
            <button class="key" type="button" data-value="3">3</button>
            <button class="key key--operator" type="button" data-value="*">×</button>

            <!-- 4行目 -->
            <button class="key" type="button" data-value="0">0</button>
            <button class="key" type="button" data-value="00">00</button>
            <button class="key" type="button" data-value=".">.</button>
            <button class="key key--operator" type="button" data-value="/">÷</button>

            <!-- 5行目 -->
            <button class="key key--wide" type="button" data-action="clear">AC</button>
            <button class="key key--wide key--equal" type="button" data-action="equal">=</button>
          </div>
        </div>
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>
